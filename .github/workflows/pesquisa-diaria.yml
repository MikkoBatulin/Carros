name: pesquisa-diaria
on:
  schedule: [{cron: "0 11 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests
      - run: python collector.py
      - run: |
          git config user.name "robo-pesquisa"; git config user.email "robo@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Pesquisa diária" && git push)
